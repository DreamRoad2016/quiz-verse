<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="description" content="猜猜宇宙：个人人物资料收藏站，按影视剧、小说、历史整理人物信息，便于查阅与学习。" />
  <title>猜猜宇宙 · 人物资料收藏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3f8fb;
      --ink: #1a2a32;
      --muted: #6b8490;
      --accent: #2a8f9e;
      --line: rgba(31, 111, 139, 0.12);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 90% 0%, rgba(91, 184, 208, 0.2), transparent 60%),
        radial-gradient(ellipse 50% 40% at 0% 40%, rgba(61, 168, 154, 0.1), transparent 55%),
        var(--paper);
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1000px, 100%); margin: 0 auto; padding: 28px 20px 64px; }
    .brand {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
    }
    .lead {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.75;
      max-width: 36em;
      margin-bottom: 28px;
    }
    .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }
    .cat {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--muted);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: 0.25s var(--ease);
    }
    .cat.on {
      color: #fff;
      background: linear-gradient(135deg, #1f6f8b, #2a8f9e);
      border-color: transparent;
    }
    .hint {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .card {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.78);
      border-radius: 16px;
      padding: 18px 16px;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s var(--ease), box-shadow 0.25s;
    }
    .card.ready {
      background: linear-gradient(165deg, #fff, #e8f7fa);
      cursor: pointer;
    }
    .card.ready:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(42, 143, 158, 0.12);
    }
    .card.soon { opacity: 0.72; }
    .badge {
      align-self: flex-start;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      color: var(--accent);
      background: rgba(42, 143, 158, 0.12);
    }
    .card.soon .badge {
      color: #8a969c;
      background: rgba(138, 150, 156, 0.12);
    }
    .card h3 {
      font-family: "Noto Serif SC", serif;
      font-size: 1.2rem;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    .card p { color: var(--muted); font-size: 0.86rem; line-height: 1.5; flex: 1; }
    .go { margin-top: 14px; color: var(--accent); font-size: 0.88rem; font-weight: 600; }
    .foot {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="brand">猜猜宇宙</h1>
    <p class="lead">个人人物资料收藏站。按影视剧、小说、历史整理人物信息，方便查阅学习。内容持续补充中。</p>

    <div class="cats" id="cats"></div>
    <p class="hint" id="hint"></p>
    <div class="grid" id="grid"></div>

    <footer class="foot">
      猜猜宇宙 · 个人非商业资料整理站点。当前可查阅专题：甄嬛传、水浒传。本站不含新闻资讯、音视频直播、在线交易等内容。
    </footer>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/worlds.js"></script>
  <script>
    let active = 'hot';

    function render() {
      const W = window.CCYZ_WORLDS;
      const hot = W.HOT;
      const tabs = [
        { id: 'hot', name: hot.name, hint: hot.hint },
        ...W.CATEGORIES.map((c) => ({ id: c.id, name: c.name, hint: c.hint }))
      ];
      const tab = tabs.find((c) => c.id === active) || tabs[0];
      const worlds = active === 'hot'
        ? W.HOT_WORLDS
        : ((W.CATEGORIES.find((c) => c.id === active) || W.CATEGORIES[0]).worlds);

      document.getElementById('cats').innerHTML = tabs.map((c) =>
        `<button type="button" class="cat ${c.id === active ? 'on' : ''}" data-id="${c.id}">${c.name}</button>`
      ).join('');
      document.getElementById('hint').textContent = tab.hint || '';
      document.getElementById('grid').innerHTML = worlds.map((w) => {
        if (w.ready) {
          return `<a class="card ready" href="/collection.html?world=${encodeURIComponent(w.id)}">
            <span class="badge">${w.badge || '可查阅'}</span>
            <h3>${w.title}</h3>
            <p>${w.subtitle || ''}</p>
            <span class="go">查看人物资料 →</span>
          </a>`;
        }
        return `<div class="card soon">
          <span class="badge">${w.badge || '整理中'}</span>
          <h3>${w.title}</h3>
          <p>${w.subtitle || ''}</p>
          <span class="go" style="color:#9aa3b0">敬请期待</span>
        </div>`;
      }).join('');

      document.querySelectorAll('.cat').forEach((el) => {
        el.addEventListener('click', () => {
          active = el.dataset.id;
          render();
        });
      });
    }

    window.CCYZ_WORLDS.ensureLoaded().then(render).catch(render);
  </script>
</body>
</html>
