quiz:
  match:
    store: redis
    ttl-hours: 24
  security:
    enabled: ${QUIZ_SECURITY_ENABLED:true}
    session-ttl-hours: 72
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
